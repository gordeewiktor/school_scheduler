<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}School Scheduler{% endblock %}</title>
    <style>
        body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #222; background: #f7f7f8; }
        a { color: #0b5cad; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .navbar { background: #222; color: #fff; padding: 0.75rem 1rem; }
        .container-fluid, .container { max-width: 1120px; margin: 0 auto; }
        .navbar .container-fluid { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
        .navbar-brand { color: #fff; font-weight: 700; margin-right: 1rem; }
        .navbar-nav { display: flex; gap: 0.8rem; flex-wrap: wrap; }
        .nav-link { color: #e7e7e7; }
        .me-auto { margin-right: auto; }
        .py-4 { padding-top: 1.5rem; padding-bottom: 1.5rem; }
        .mb-3 { margin-bottom: 1rem; }
        .mb-4 { margin-bottom: 1.5rem; }
        .mt-4 { margin-top: 1.5rem; }
        .h2 { font-size: 1.65rem; }
        .h3 { font-size: 1.35rem; }
        .h4 { font-size: 1.15rem; }
        .d-flex { display: flex; }
        .justify-content-between { justify-content: space-between; }
        .align-items-center { align-items: center; }
        .row { display: flex; flex-wrap: wrap; margin: -0.5rem; }
        .g-2 > *, .g-3 > * { padding: 0.5rem; }
        .col-md-3 { flex: 1 1 220px; }
        .col-md-4 { flex: 1 1 280px; }
        .col-md-5 { flex: 1 1 360px; max-width: 520px; }
        .justify-content-center { justify-content: center; }
        .border { border: 1px solid #ddd; }
        .rounded { border-radius: 6px; }
        .p-3 { padding: 1rem; background: #fff; }
        .table { width: 100%; border-collapse: collapse; background: #fff; }
        .table th, .table td { padding: 0.65rem; border-bottom: 1px solid #e1e1e1; text-align: left; }
        .table-bordered th, .table-bordered td { border: 1px solid #ddd; }
        .table-striped tbody tr:nth-child(odd) { background: #fafafa; }
        .text-end { text-align: right; }
        .text-muted { color: #666; }
        .text-danger { color: #b42318; }
        .small { font-size: 0.875rem; }
        .btn { display: inline-block; border: 1px solid transparent; border-radius: 4px; padding: 0.45rem 0.75rem; background: #eee; color: #222; cursor: pointer; font: inherit; }
        .btn-primary { background: #0b5cad; color: #fff; }
        .btn-secondary { background: #555; color: #fff; }
        .btn-danger { background: #b42318; color: #fff; }
        .btn-outline-secondary, .btn-outline-danger, .btn-outline-light { background: transparent; border-color: currentColor; }
        .btn-outline-danger { color: #b42318; }
        .btn-outline-light { color: #fff; }
        .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.9rem; }
        .btn-link { background: transparent; color: #0b5cad; }
        .form-control, .form-select, input, select, textarea { width: 100%; box-sizing: border-box; padding: 0.45rem; border: 1px solid #bbb; border-radius: 4px; font: inherit; }
        .form-label { display: block; margin-bottom: 0.35rem; font-weight: 600; }
        .alert { padding: 0.75rem; border-radius: 4px; margin-bottom: 1rem; background: #eef6ff; }
        .alert-danger { background: #fff1f0; color: #8a1f17; }
        .alert-success { background: #eef9f0; color: #176b2c; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'dashboard' %}">School Scheduler</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" href="{% url 'schedule' %}">Schedule</a>
            <a class="nav-link" href="{% url 'teacher-list' %}">Teachers</a>
            <a class="nav-link" href="{% url 'room-list' %}">Rooms</a>
            <a class="nav-link" href="{% url 'subject-list' %}">Subjects</a>
            <a class="nav-link" href="{% url 'student-group-list' %}">Groups</a>
            <a class="nav-link" href="{% url 'academic-year-list' %}">Academic Years</a>
            <a class="nav-link" href="{% url 'period-list' %}">Periods</a>
            <a class="nav-link" href="{% url 'lesson-list' %}">Lessons</a>
            <a class="nav-link" href="/admin/">Admin</a>
        </div>
        {% if user.is_authenticated %}
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
            </form>
        {% endif %}
    </div>
</nav>
<main class="container py-4">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
