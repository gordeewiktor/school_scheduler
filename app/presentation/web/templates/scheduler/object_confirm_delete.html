{% extends "scheduler/base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<h1 class="h2 mb-3">{{ title }}</h1>
<p>Delete <strong>{{ object }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Delete</button>
    <a class="btn btn-link" href="{% url list_url_name %}">Cancel</a>
</form>
{% endblock %}
